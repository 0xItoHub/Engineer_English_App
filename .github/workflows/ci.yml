name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定はリポジトリの読み取りのみ
permissions:
  contents: read

# 同じブランチ / PR の古い実行は自動でキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set test-only SECRET_KEY
        # CI 実行ごとにランダム生成するテスト専用の値
        run: echo "DJANGO_SECRET_KEY=ci-$(python -c 'import secrets;print(secrets.token_urlsafe(32))')" >> "${GITHUB_ENV}"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Test (pytest)
        run: pytest --cov=core --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
        env:
          CI: "true"

      - name: Build
        run: npm run build

      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=critical

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Init (without backend)
        # リモートステートには接続せず、プロバイダの取得のみ行う
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra validate

  docker-build:
    name: Docker build (Lambda image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          tags: engineer-english-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
