version: 2

updates:
  # Python（requirements.txt / requirements-dev.txt）
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels: [dx, backend]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Django は LTS（5.2 → 次は 6.2）単位で更新する。5.2.x のパッチは引き続き提案される
      - dependency-name: "django"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # フロントエンド（frontend/package.json）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels: [dx, frontend]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript のメジャー更新は Lint ツールの対応状況を確認してから行う
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions（.github/workflows）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: [dx, ci-cd]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Terraform プロバイダ（infra/）
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: [dx, infra]
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]

  # Lambda コンテナのベースイメージ（Dockerfile.lambda）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    labels: [dx, infra]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Python のバージョンは CI（setup-python）と揃えて更新する
      - dependency-name: "public.ecr.aws/lambda/python"
        update-types: ["version-update:semver-minor"]
