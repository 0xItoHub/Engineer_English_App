# pre-commit フック設定
# 導入: pip install pre-commit && pre-commit install
# 全ファイルに実行: pre-commit run --all-files
repos:
  # 基本的なファイル衛生チェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        # frontend/package-lock.json を考慮して上限を 1MB に設定
        args: [--maxkb=1024]

  # Python: ruff による lint と format（設定は pyproject.toml）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Terraform: terraform fmt（ローカルに terraform のインストールが必要）
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
